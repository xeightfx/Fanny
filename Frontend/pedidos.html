<!DOCTYPE html>
<html lang="es"><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis pedidos | Fanny.com</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head><body>
<nav class="navbar bg-white border-bottom"><div class="container">
  <a class="navbar-brand logo" href="index.html">Style<span>Market</span></a>
  <div id="navUsuario"></div>
</div></nav>
<main class="container my-4">
  <h1 class="h3 fw-bold mb-3">Mis pedidos</h1>
  <div id="lista"></div>
</main>
<span id="contadorCarrito" class="d-none"></span>
<script src="js/config.js"></script><script src="js/auth.js"></script>
<script>
if (!esCliente()) location.href = "login.html?volver=pedidos.html";
dibujarNav();
apiFetch("/cliente/pedidos").then(ps => {
  document.getElementById("lista").innerHTML = ps.length ? ps.map(p => `
    <div class="card mb-3 shadow-sm"><div class="card-body">
      <div class="d-flex justify-content-between"><b>${p.numeroPedido}</b><span class="badge text-bg-dark">${p.estado}</span></div>
      <small class="text-muted">${new Date(p.fechaPedido).toLocaleString()} · ${p.metodoEntrega}${p.direccion ? " · " + p.direccion : ""}</small>
      <ul class="mt-2 mb-1">${p.detalles.map(d => `<li>${d.cantidad} × ${d.producto} — S/ ${Number(d.subtotal).toFixed(2)}</li>`).join("")}</ul>
      <b>Total: S/ ${Number(p.total).toFixed(2)}</b>
    </div></div>`).join("") : `<p class="text-muted">Aún no tienes pedidos.</p>`;
}).catch(e => document.getElementById("lista").innerHTML = `<div class="alert alert-danger">${e.message}</div>`);
</script></body></html>
