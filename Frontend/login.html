<!DOCTYPE html>
<html lang="es"><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar | Fanny.com</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head><body>
<nav class="navbar bg-white border-bottom"><div class="container">
  <a class="navbar-brand logo" href="index.html">Style<span>Market</span></a>
</div></nav>
<main class="container my-5" style="max-width:460px">
  <div id="msg"></div>
  <ul class="nav nav-tabs mb-3">
    <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tLogin">Ingresar</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tReg">Crear cuenta</button></li>
  </ul>
  <div class="tab-content">
    <form class="tab-pane fade show active" id="tLogin">
      <input id="lEmail" type="email" class="form-control mb-2" placeholder="Email" required>
      <input id="lPass" type="password" class="form-control mb-3" placeholder="Contraseña" required>
      <button class="btn btn-marca w-100">Ingresar</button>
    </form>
    <form class="tab-pane fade" id="tReg">
      <input id="rNom" class="form-control mb-2" placeholder="Nombres" required>
      <input id="rApe" class="form-control mb-2" placeholder="Apellidos" required>
      <input id="rEmail" type="email" class="form-control mb-2" placeholder="Email" required>
      <input id="rTel" class="form-control mb-2" placeholder="Teléfono (opcional)">
      <input id="rPass" type="password" minlength="6" class="form-control mb-3" placeholder="Contraseña (mín. 6)" required>
      <button class="btn btn-marca w-100">Crear cuenta</button>
    </form>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script><script src="js/auth.js"></script>
<script>
const $ = id => document.getElementById(id);
const aviso = (t, tipo = "danger") => $("msg").innerHTML = `<div class="alert alert-${tipo}">${t}</div>`;
async function entrar(email, pass) {
  await login(email, pass);
  const volver = new URLSearchParams(location.search).get("volver");
  location.href = volver || "index.html";
}
$("tLogin").onsubmit = async e => {
  e.preventDefault();
  try { await entrar($("lEmail").value.trim(), $("lPass").value); } catch (err) { aviso(err.message); }
};
$("tReg").onsubmit = async e => {
  e.preventDefault();
  try {
    await apiFetch("/auth/registro", { method: "POST", body: JSON.stringify({
      nombres: $("rNom").value.trim(), apellidos: $("rApe").value.trim(),
      email: $("rEmail").value.trim(), password: $("rPass").value, telefono: $("rTel").value.trim() || null }) });
    await entrar($("rEmail").value.trim(), $("rPass").value);
  } catch (err) { aviso(err.message); }
};
</script></body></html>
